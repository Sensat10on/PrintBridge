name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The build pins its toolchain to JDK 21 (see docs/RELEASE_PROCESS.md). A newer JDK
      # breaks the Robolectric suite, and the pinned JDK also keeps APK hashes comparable.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Unit tests
        run: ./gradlew test --console=plain --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --console=plain

      - name: Lint (release gate for errors)
        run: ./gradlew lintDebug --console=plain

      - name: Report artifact hash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          ls -l "$APK"
          sha256sum "$APK"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-debug.*
            '*/build/reports/tests/**'
          if-no-files-found: ignore
          retention-days: 14

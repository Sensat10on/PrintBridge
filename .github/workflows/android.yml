name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The build pins its toolchain to JDK 21 (see docs/RELEASE_PROCESS.md). A newer JDK
      # breaks the Robolectric suite, and the pinned JDK also keeps APK hashes comparable.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Unit tests
        run: ./gradlew test --console=plain --stacktrace

      # The app has two product flavours, so there is no bare :app:assembleDebug to depend on;
      # building both keeps the release behaviour and the full test build compiling.
      - name: Assemble debug APKs (paid and full)
        run: ./gradlew :app:assemblePaidDebug :app:assembleFullDebug --console=plain

      - name: Lint (release gate for errors)
        run: ./gradlew :app:lintPaidDebug --console=plain

      - name: Report artifact hashes
        run: |
          for APK in app/build/outputs/apk/paid/debug/app-paid-debug.apk \
                     app/build/outputs/apk/full/debug/app-full-debug.apk; do
            ls -l "$APK"
            sha256sum "$APK"
          done

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.sarif
            '*/build/reports/tests/**'
          if-no-files-found: ignore
          retention-days: 14
